<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>シフToカレ - 各種ご案内</title>
    <meta
      name="description"
      content="シフト表の写真をAIが読み取り、あなたのシフトだけをApple／Googleカレンダーへ登録するiPhone向けアプリです。プライバシーポリシー・利用規約・特定商取引法に基づく表記・お問い合わせ・よくある質問をご案内しています。"
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #5c5c5c;
        --rule: #e2e2e2;
        --link: #0b5bcb;
        --card: #f7f7f8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181c;
          --fg: #e8e8ea;
          --muted: #a2a4ab;
          --rule: #32353c;
          --link: #86b4ff;
          --card: #1e2127;
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          'Hiragino Kaku Gothic ProN',
          'Noto Sans JP',
          'Yu Gothic',
          sans-serif;
        font-size: 16px;
        line-height: 1.85;
        overflow-wrap: break-word;
        word-break: normal;
        line-break: strict;
      }
      main {
        max-width: 42em;
        margin: 0 auto;
        padding: 24px 20px 56px;
      }
      .home {
        margin: 0 0 20px;
        font-size: 0.875rem;
        color: var(--muted);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 1.5rem;
        line-height: 1.5;
      }
      .lead {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 0.9375rem;
      }
      h2 {
        margin: 0;
        font-size: 1.0625rem;
        line-height: 1.6;
      }
      h3 {
        margin: 0;
        font-size: 1rem;
        line-height: 1.6;
      }
      article .blk + .blk {
        margin-top: 1.5em;
      }
      article p {
        margin: 0;
      }
      article * + p,
      article * + ul,
      article * + h2,
      article * + h3 {
        margin-top: 0.5em;
      }
      article ul {
        margin: 0;
        padding-left: 1.3em;
      }
      article li {
        margin: 0.2em 0;
      }
      a {
        color: var(--link);
      }
      .toc {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .toc li + li {
        margin-top: 10px;
      }
      .toc a {
        display: block;
        padding: 14px 16px;
        border: 1px solid var(--rule);
        border-radius: 10px;
        background: var(--card);
        text-decoration: none;
        font-weight: 600;
      }
      nav.footer {
        margin-top: 48px;
        padding-top: 20px;
        border-top: 1px solid var(--rule);
        font-size: 0.875rem;
      }
      nav.footer ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      nav.footer li {
        margin: 6px 0;
      }
      footer.meta {
        margin-top: 28px;
        color: var(--muted);
        font-size: 0.8125rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>シフToカレ</h1>
      <p class="lead">
        シフト表の写真をAIが読み取り、あなたのシフトだけをApple／Googleカレンダーへ登録するiPhone向けアプリです。
      </p>
      <ul class="toc">
        <li><a href="./privacy.html">プライバシーポリシー</a></li>
        <li><a href="./terms.html">利用規約</a></li>
        <li><a href="./tokushoho.html">特定商取引法に基づく表記</a></li>
        <li><a href="./contact.html">お問い合わせ</a></li>
        <li><a href="./faq.html">ヘルプ・よくある質問</a></li>
      </ul>
      <footer class="meta">
        <p>
          お問い合わせ:
          <a href="mailto:shiftokare.support@gmail.com">shiftokare.support@gmail.com</a>
        </p>
      </footer>
    </main>
  </body>
</html>
